[dmenu]
dmenu_command = fuzzel --dmenu --prompt "Wi-Fi"
highlight = True
highlight_bold = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}
list_saved = True
prompt = Networks

[dmenu_passphrase]
show_pass = flatpak run org.wezfurlong.wezterm start -- bash -c "nmcli device wifi show-password; read -n1 -p 'Press any key...'"

[editor]
terminal = flatpak run org.wezfurlong.wezterm
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
