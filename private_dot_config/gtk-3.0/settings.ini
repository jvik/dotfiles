[Settings]
gtk-cursor-theme-name=phinger-cursors-light
gtk-cursor-theme-size=36
# Plain GTK3 apps on Sway read the theme from this file, not from gsettings, and
# GTK3 watches it so a rewrite restyles them live. The two keys below are
# therefore rewritten in place by ~/.local/share/darkman-hooks/gtk; the values
# checked in here are just the dark starting point, and
# run_after_50_apply-darkman-theme.sh puts the live mode back after a chezmoi
# apply.
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
