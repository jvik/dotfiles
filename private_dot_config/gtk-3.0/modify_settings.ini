{{- /* chezmoi:modify-template */ -}}
{{- /*
Plain GTK3 apps on Sway read the theme from this file, not from gsettings, and
GTK3 watches it so any rewrite restyles every open app. The two theme keys are
owned by ~/.local/share/darkman-hooks/gtk, so carry their live values over
instead of resetting them; dark is only the starting point for a fresh file.
Leaving the content unchanged means chezmoi apply never touches the file.
*/ -}}
{{- $theme := regexFind "(?m)^gtk-theme-name=.*$" .chezmoi.stdin | default "gtk-theme-name=Adwaita-dark" -}}
{{- $dark := regexFind "(?m)^gtk-application-prefer-dark-theme=.*$" .chezmoi.stdin | default "gtk-application-prefer-dark-theme=1" -}}
[Settings]
gtk-cursor-theme-name=phinger-cursors-light
gtk-cursor-theme-size=36
# gtk-theme-name and gtk-application-prefer-dark-theme are rewritten in place
# by ~/.local/share/darkman-hooks/gtk; chezmoi preserves whatever they hold.
{{ $theme }}
{{ $dark }}
