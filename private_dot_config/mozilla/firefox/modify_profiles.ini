{{- /* chezmoi:modify-template */ -}}
{{- /*
Firefox rewrites profiles.ini whenever it starts, so this only enforces what the
setup relies on and passes everything else through: the arkenfox profile in
./main is the default, and every Firefox install opens it.

Firefox records each install's profile in an [Install<hash>] section, where the
hash comes from the install path and differs per distro, so it can't be written
ahead of time. Instead, any install section Firefox adds is pointed at main on
the next apply. A file that already satisfies this is left byte-for-byte as is.
*/ -}}
{{- $ini := .chezmoi.stdin | fromIni -}}
{{- $before := toJson $ini -}}

{{- $general := get $ini "General" | default dict -}}
{{- $_ := set $ini "General" $general -}}
{{- if not (hasKey $general "StartWithLastProfile") }}{{ $_ := set $general "StartWithLastProfile" "1" }}{{ end -}}
{{- /* Version=2 tells Firefox the install sections live here, not in installs.ini. */ -}}
{{- if not (hasKey $general "Version") }}{{ $_ := set $general "Version" "2" }}{{ end -}}

{{- $profileCount := 0 -}}
{{- $mainProfile := "" -}}
{{- range $name, $section := $ini -}}
{{-   if regexMatch "^Profile[0-9]+$" $name -}}
{{-     $profileCount = add1 $profileCount -}}
{{-     if eq (get $section "Path") "main" }}{{ $mainProfile = $name }}{{ end -}}
{{-   end -}}
{{- end -}}
{{- if not $mainProfile -}}
{{- /* Firefox numbers profile sections without gaps, so take the next index. */ -}}
{{-   $mainProfile = printf "Profile%d" $profileCount -}}
{{-   $_ := set $ini $mainProfile (dict "Name" "main" "IsRelative" "1" "Path" "main") -}}
{{- end -}}

{{- range $name, $section := $ini -}}
{{-   if eq $name $mainProfile -}}
{{-     $_ := set $section "Default" "1" -}}
{{-   else if regexMatch "^Profile[0-9]+$" $name -}}
{{-     $_ := unset $section "Default" -}}
{{-   else if regexMatch "^Install[0-9A-F]+$" $name -}}
{{-     $_ := set $section "Default" "main" -}}
{{-     $_ := set $section "Locked" "1" -}}
{{-   end -}}
{{- end -}}

{{- if eq $before (toJson $ini) -}}
{{- .chezmoi.stdin -}}
{{- else -}}
{{- /* Not toIni: it writes `key = "value"`, which Firefox's parser reads differently. */ -}}
{{- range $name, $section := $ini -}}
[{{ $name }}]
{{ range $key, $value := $section -}}
{{ $key }}={{ $value }}
{{ end }}
{{ end -}}
{{- end -}}
