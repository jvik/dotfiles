# Used only by ~/scripts/sway-shortcuts.sh (wofi --conf).
# Deliberately separate from ~/.config/wofi/config, which is tuned for drun mode:
# its width/height/prompt and allow_images=true leak into --dmenu, and wofi's
# boolean CLI flags are set-only (there is no --no-allow-images to undo it).
# --conf does not affect --style, so ~/.config/wofi/style.css still applies.
allow_markup=true
allow_images=false
parse_search=true
insensitive=true
matching=multi-contains
location=center
no_actions=true
dmenu-print_line_num=true
