---
- name: List installed uv tools
  become: false
  ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/uv tool list
  register: dev_tools_uv_tool_list
  changed_when: false
  failed_when: false

- name: Install uv tools
  become: false
  ansible.builtin.command: >
    /home/linuxbrew/.linuxbrew/bin/uv tool install {{ item }}
  register: dev_tools_uv_tool_install
  changed_when: dev_tools_uv_tool_install.rc == 0
  environment:
    PATH: '/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}'
  loop:
    - rofimoji
    - autotiling
  when: item not in dev_tools_uv_tool_list.stdout
