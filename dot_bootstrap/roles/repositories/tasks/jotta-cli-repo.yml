---
- name: Configure Jottacloud CLI repository
  when: ansible_distribution == 'Fedora'
  block:
    - name: Import Jottacloud GPG Key
      ansible.builtin.rpm_key:
        key: https://repo.jotta.cloud/public.asc
        state: present

    - name: Add Jottacloud CLI repository
      ansible.builtin.yum_repository:
        name: jotta-cli
        description: Jottacloud CLI
        baseurl: https://repo.jotta.cloud/redhat
        gpgcheck: true
        gpgkey: https://repo.jotta.cloud/public.asc
        enabled: true
