---
- name: Set user shell to fish
  ansible.builtin.user:
    name: '{{ user }}'
    shell: /bin/fish
  become: true

- name: Check if tpm plugin manager exists
  ansible.builtin.stat:
    path: '/home/{{ user }}/.config/tmux/plugins/tpm'
  register: shell_tpm_stat

- name: Install tpm plugin manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: '/home/{{ user }}/.config/tmux/plugins/tpm'
    version: 'master'
    clone: true
    update: true
  become: false
  when: not shell_tpm_stat.stat.exists

- name: Check if Fisher plugin manager exists
  ansible.builtin.stat:
    path: '/home/{{ user }}/.config/fish/functions/fisher.fish'
  register: shell_fisher_stat

- name: Install Fisher plugin manager
  ansible.builtin.shell: |
    set -o pipefail
    fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
  args:
    creates: '/home/{{ user }}/.config/fish/functions/fisher.fish'
    executable: /bin/bash
  become: false
  when: not shell_fisher_stat.stat.exists

- name: List installed Fisher plugins
  ansible.builtin.command: fish -c "fisher list"
  become: false
  register: shell_fisher_list
  changed_when: false
  failed_when: false

- name: Install Fisher plugins
  vars:
    shell_fisher_plugins:
      - PatrickF1/fzf.fish
      - lewisacidic/fish-git-abbr
    # fisher records plugin names lowercased, so compare case-insensitively.
    shell_fisher_missing: "{{ shell_fisher_plugins | map('lower') | difference(shell_fisher_list.stdout_lines | map('lower')) }}"
  ansible.builtin.command:
    argv:
      - fish
      - -c
      - "fisher install {{ shell_fisher_missing | join(' ') }}"
  become: false
  changed_when: true
  when: shell_fisher_missing | length > 0
