---
- name: Import udev rules setup
  ansible.builtin.import_tasks: udev-rules.yml

- name: Import sway systemd session setup
  ansible.builtin.import_tasks: sway-session.yml

- name: Import systemd user services setup
  ansible.builtin.import_tasks: systemd-user-services.yml

- name: Import logind sleep policy setup
  ansible.builtin.import_tasks: logind-sleep-policy.yml

- name: Import inotify limits setup
  ansible.builtin.import_tasks: inotify-limits.yml

# become: false on a static import is applied to every imported task (the
# equivalent of include_tasks' `apply:`); tasks that set become themselves win.
- name: Import Firefox arkenfox setup
  ansible.builtin.import_tasks: firefox-arkenfox.yml
  become: false

