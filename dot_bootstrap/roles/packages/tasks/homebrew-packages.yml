---
- name: Install Homebrew packages
  become: true
  become_user: "{{ user }}"
  community.general.homebrew:
    name:
      - ctop
      - eza
      - fzf
      - gh
      - just
      - tfenv
      - uv
      - zoxide
      - kubectl
      - kubectx
      - k9s
      - helm
      - sesh
      - lazygit
      - ranger
      - ipython
      # Required for the latest LazyVim
      - tree-sitter-cli
      - mise
      - topgrade
      - PeonPing/tap/peon-ping
    state: present
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
