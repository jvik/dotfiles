---
- name: Install sway packages
  ansible.builtin.package:
    name:
      - sway
      - fuzzel
      - waybar
      - wdisplays
      - lxpolkit
      - grim
      - slurp
      - wl-clipboard
      - rofimoji
      - inotify-tools # waybar's update-status.sh watches its summary file
    state: present
