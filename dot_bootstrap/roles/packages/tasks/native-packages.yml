# Packages are passed as one list so each distro does a single transaction
# instead of one dnf/apt run (and metadata load) per package.
- name: Install native packages with dnf
  ansible.builtin.dnf:
    name: "{{ packages_native }}"
    state: present
    update_cache: true
    lock_timeout: 180
  when: ansible_distribution == 'Fedora'

- name: Install native packages with apt
  ansible.builtin.apt:
    name: "{{ packages_native }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  when: ansible_distribution == 'Ubuntu'

- name: Install native packages on other distributions
  ansible.builtin.package:
    name: "{{ packages_native }}"
    state: present
  when: ansible_distribution not in ['Fedora', 'Ubuntu']
