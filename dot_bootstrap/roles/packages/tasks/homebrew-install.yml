---
- name: Check if HomeBrew is installed
  become: true
  become_user: "{{ user }}"
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: homebrew_brew

- name: Download & Install HomeBrew
  become: true
  become_user: "{{ user }}"
  when: not homebrew_brew.stat.exists
  block:
    - name: Create tmp dir
      ansible.builtin.file:
        path: '/home/{{ user }}/temp'
        state: directory
        mode: '0755'

    - name: Download Installer Script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
        dest: /home/{{ user }}/temp/brew_install.sh
        mode: '775'

    - name: Run Installer Script
      ansible.builtin.command: /home/{{ user }}/temp/brew_install.sh
      environment:
        NONINTERACTIVE: '1'
      changed_when: true

# Only chown entries whose owner has drifted, instead of rewriting every file in
# the prefix on each run. No forced `brew update` here: upgrades are topgrade's
# job, and `brew install` auto-updates when it has a missing formula to install.
- name: Fix Homebrew directory ownership
  ansible.builtin.command:
    argv:
      - find
      - /home/linuxbrew/.linuxbrew
      - (
      - "!"
      - -user
      - "{{ user }}"
      - -o
      - "!"
      - -group
      - "{{ user }}"
      - )
      - -exec
      - chown
      - -h
      - "{{ user }}:{{ user }}"
      - "{}"
      - +
      - -print
  become: true
  register: packages_homebrew_chown
  changed_when: packages_homebrew_chown.stdout | length > 0
  failed_when: false

- name: Set LinuxBrew Executable Path
  ansible.builtin.set_fact:
    homebrew_executable: /home/linuxbrew/.linuxbrew/bin/brew
    homebrew_path: /home/linuxbrew/.linuxbrew/bin
