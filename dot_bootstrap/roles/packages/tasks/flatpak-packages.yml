---
- name: Add Flathub remote
  become: true
  become_user: "{{ user }}"
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user

- name: Install Flatpak packages
  become: true
  become_user: "{{ user }}"
  community.general.flatpak:
    method: user
    name:
      - org.videolan.VLC
      - com.bitwarden.desktop/x86_64/stable
      - com.fastmail.Fastmail/x86_64/stable
      - com.github.tchx84.Flatseal/x86_64/stable
      - com.mattjakeman.ExtensionManager/x86_64/stable
      - com.mikrotik.WinBox/x86_64/stable
      - com.plexamp.Plexamp/x86_64/stable
      - com.saivert.pwvucontrol/x86_64/stable
      - dev.vencord.Vesktop/x86_64/stable
      - md.obsidian.Obsidian/x86_64/stable
      - io.github.seadve.Kooha/x86_64/stable
      - com.github.jeromerobert.pdfarranger/x86_64/stable
      - it.mijorus.smile/x86_64/stable
      - io.github.peazip.PeaZip/x86_64/stable
      - org.wezfurlong.wezterm/x86_64/stable
    state: present

# Satty is not published on Flathub, so it is installed from the release bundle
# rather than through the flatpak module. Installed system-wide to match the
# existing install.
- name: Check whether Satty is installed
  ansible.builtin.command:
    cmd: flatpak info org.satty.Satty
  register: packages_satty_installed
  changed_when: false
  failed_when: false

- name: Install Satty from its release bundle
  vars:
    satty_version: "0.22.0"
  when: packages_satty_installed.rc != 0
  block:
    - name: Download Satty Flatpak bundle
      ansible.builtin.get_url:
        url: https://github.com/Satty-org/Satty/releases/download/v{{ satty_version }}/satty-v{{ satty_version }}.flatpak
        dest: /tmp/satty-v{{ satty_version }}.flatpak
        mode: "0644"

    - name: Install Satty bundle
      become: true
      ansible.builtin.command:
        cmd: flatpak install --system --assumeyes --noninteractive
          /tmp/satty-v{{ satty_version }}.flatpak
      changed_when: true

# Satty's --copy-command shells out via `flatpak-spawn --host` (see
# scripts/executable_satty-screenshot.sh) so the clipboard write lands on the
# host instead of being lost to the sandbox. That requires talking to
# org.freedesktop.Flatpak, which isn't granted by Satty's own manifest.
- name: Allow Satty to use flatpak-spawn --host for clipboard access
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: flatpak override --user --talk-name=org.freedesktop.Flatpak org.satty.Satty
  changed_when: false

# Bitwarden's launcher forces --ozone-platform=x11 by default (Electron 39
# Wayland/GPU crash workaround), which runs it under XWayland and breaks the
# sway-configured cursor theme. USE_X11=false is the escape hatch it honors.
- name: Force Bitwarden to run on native Wayland instead of XWayland
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: flatpak override --user --env=USE_X11=false com.bitwarden.desktop
  changed_when: false
