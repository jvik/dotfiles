---
- name: Check if networkmanager_dmenu is installed
  become: true
  become_user: "{{ user }}"
  ansible.builtin.stat:
    path: "/home/{{ user }}/.local/bin/networkmanager_dmenu"
  register: networkmanager_dmenu_stat

- name: Install networkmanager_dmenu
  become: true
  become_user: "{{ user }}"
  when: not networkmanager_dmenu_stat.stat.exists
  block:
    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "/home/{{ user }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Download networkmanager_dmenu
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/firecat53/networkmanager-dmenu/v2.6.2/networkmanager_dmenu
        dest: "/home/{{ user }}/.local/bin/networkmanager_dmenu"
        mode: "0755"
