---
- name: System setup and package installation
  hosts: localhost
  become: true
  gather_facts: true
  # Only distribution, env and user facts are used; skip hardware/network probing.
  gather_subset:
    - min
  vars_files:
    - ~/.bootstrap/vars.yml
  vars:
    # Skip interpreter discovery: it prefers versioned names like python3.13 found on
    # PATH, which can be a mise/uv shim that errors out when no version is selected.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  pre_tasks:
    - name: Verify sudo credentials
      ansible.builtin.command: whoami
      become: true
      changed_when: false
      tags: [always]

  # Each role is tagged with its own name so run_onchange_02_install.sh can run
  # only the roles whose files changed (--tags). Keep tags in sync with the
  # role list in that script.
  roles:
    - { role: repositories, tags: [repositories] }
    - { role: packages, tags: [packages] }
    - { role: shell, tags: [shell] }
    - { role: dev_tools, tags: [dev_tools] }
    - { role: system, tags: [system] }
    - { role: extras, tags: [extras] }
